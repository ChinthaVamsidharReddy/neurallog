version: '3.9'

services:
  mysql:
    image: mysql:8.2
    container_name: llm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: llmplatform
      MYSQL_USER: llmuser
      MYSQL_PASSWORD: llmpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "llmuser", "-pllmpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - llm-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/llmplatform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: llmuser
      DB_PASSWORD: llmpassword
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-demo}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo-key}
      GROQ_API_KEY: ${GROQ_API_KEY:-demo-key}
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/providers"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - llm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - llm-network

volumes:
  mysql_data:
    driver: local

networks:
  llm-network:
    driver: bridge