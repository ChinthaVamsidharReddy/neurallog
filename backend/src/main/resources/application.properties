spring.application.name=llm-platform

# ── Database ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/llmplatform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Server ────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.compression.enabled=true

# ── CORS ──────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000
# ── LLM Providers ─────────────────────────────────────────────────
# Only fill in keys for providers you have access to.
# Providers with blank keys are automatically disabled.
# The backend will auto-route requests to the first available provider.

openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta

groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1

# ── Logging ───────────────────────────────────────────────────────
logging.level.com.llmplatform=INFO
logging.level.org.springframework.web=WARN

# ── Springdoc / Swagger ───────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Ingestion ─────────────────────────────────────────────────────
app.ingestion.async=true
app.ingestion.retry-attempts=3